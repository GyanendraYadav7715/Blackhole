<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Three.js Mind Map Zoom Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d0d;
        }

        canvas {
            display: block;
        }
    </style>

    <!-- Import maps for Three.js and GSAP -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.169.0/examples/jsm/controls/OrbitControls.js",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
      }
    }
  </script>
</head>

<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { gsap } from 'gsap';

        let scene, camera, renderer, controls, raycaster;
        let nodes = [], lines = [];

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            raycaster = new THREE.Raycaster();

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // Create initial nodes
            const main = createNode("Main Topic", 0, 0, 0);
            for (let i = 0; i < 5; i++) {
                createNode(`Subtopic ${i + 1}`, Math.random() * 6 - 3, Math.random() * 6 - 3, 0);
            }

            // Connect them
            connectNodes(nodes[0], nodes.slice(1));

            window.addEventListener('click', onClick);
            window.addEventListener('resize', onWindowResize);
        }

        function createNode(label, x, y, z) {
            const geo = new THREE.SphereGeometry(0.4, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff,
                emissive: 0x111111,
                roughness: 0.4
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            nodes.push(mesh);
            return mesh;
        }

        function connectNodes(center, others) {
            others.forEach(target => {
                const points = [center.position, target.position];
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
                const line = new THREE.Line(geometry, material);
                scene.add(line);
                lines.push(line);
            });
        }

        function onClick(event) {
            const mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            if (intersects.length > 0) {
                const clickedNode = intersects[0].object;
                zoomToNode(clickedNode);
                expandNode(clickedNode);
            }
        }

        function zoomToNode(node) {
            gsap.to(camera.position, {
                duration: 1.2,
                x: node.position.x,
                y: node.position.y,
                z: node.position.z + 3,
                ease: "power2.inOut",
                onUpdate: () => camera.lookAt(node.position)
            });
        }

        function expandNode(node) {
            // Create 3 new child nodes around the clicked one
            for (let i = 0; i < 3; i++) {
                const sub = createNode(
                    `Child ${i + 1}`,
                    node.position.x + (Math.random() - 0.5) * 3,
                    node.position.y + (Math.random() - 0.5) * 3,
                    0
                );

                connectNodes(node, [sub]);

                // Animate appearance
                sub.scale.set(0, 0, 0);
                gsap.to(sub.scale, {
                    x: 1, y: 1, z: 1,
                    duration: 0.6,
                    delay: i * 0.1,
                    ease: "back.out(1.7)"
                });
            }
        }

        function onWindowResize() {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
