<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Interstellar-style Black Hole — Orbit + Flight</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 12;
            color: #ddd;
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 12px;
            border-radius: 8px;
            min-width: 220px;
        }

        #ui label {
            display: block;
            margin: 6px 0;
            font-size: 13px;
        }

        #credits {
            position: absolute;
            right: 12px;
            bottom: 12px;
            color: #888;
            font-size: 12px;
        }

        .small {
            font-size: 12px;
            color: #bbb;
            margin-top: 4px;
        }

        button {
            padding: 6px 8px;
            margin-top: 6px;
        }
    </style>

    <!-- Import map for modules (uses unpkg CDN) -->
    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.169.0/examples/jsm/controls/OrbitControls.js",
    "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/EffectComposer.js",
    "three/examples/jsm/postprocessing/RenderPass.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/RenderPass.js",
    "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/UnrealBloomPass.js",
    "three/examples/jsm/postprocessing/ShaderPass.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/ShaderPass.js",
    "three/examples/jsm/shaders/FXAAShader.js": "https://unpkg.com/three@0.169.0/examples/jsm/shaders/FXAAShader.js"
  }
}
</script>
</head>

<body>
    <div id="ui">
        <strong>Gargantua — Interactive Black Hole</strong>
        <label>
            Controls:
            <select id="controlMode">
                <option value="orbit">Orbit (mouse)</option>
                <option value="flight">Flight (WASD + mouse)</option>
            </select>
        </label>

        <label><input id="hdrToggle" type="checkbox" checked> Use HDR background</label>
        <label><input id="particlesToggle" type="checkbox" checked> Particles spiraling in</label>

        <label class="small">Flight controls: W/A/S/D move, Q/E up/down — mouse to look (pointer lock
            recommended)</label>

        <button id="pointerLockBtn">Enable Pointer Lock (Flight)</button>
        <button id="resetCamBtn">Reset Camera</button>
        <div class="small">Tip: use orbit to frame, switch to flight to fly through space</div>
    </div>

    <div id="credits">Visual demo — approximation (not exact GR)</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/examples/jsm/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/examples/jsm/shaders/FXAAShader.js';

        // -------------------- Setup renderer, scene, camera --------------------
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 2000);
        camera.position.set(0, 1.2, 8);

        // Orbit controls
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.09;
        orbitControls.enablePan = false;
        orbitControls.minDistance = 1.5;
        orbitControls.maxDistance = 100;

        // Flight controls (custom simple flight)
        let flightMode = {
            enabled: false,
            velocity: new THREE.Vector3(),
            speed: 0.06,
            pitch: 0,
            yaw: 0,
            pointerLocked: false
        };

        // pointer lock for mouse-look
        const pointerLockBtn = document.getElementById('pointerLockBtn');
        pointerLockBtn.addEventListener('click', () => {
            if (document.body.requestPointerLock) document.body.requestPointerLock();
        });

        // request pointer lock events
        document.addEventListener('pointerlockchange', () => {
            flightMode.pointerLocked = (document.pointerLockElement === document.body);
        });

        // keyboard state
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // mouse look when pointer locked
        window.addEventListener('mousemove', (e) => {
            if (flightMode.pointerLocked && flightMode.enabled) {
                flightMode.yaw -= e.movementX * 0.002;
                flightMode.pitch -= e.movementY * 0.002;
                flightMode.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, flightMode.pitch));
            }
        });

        // ------------------- Postprocessing composer -------------------
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.4, 0.8, 0.2);
        bloom.threshold = 0.18;
        bloom.strength = 1.0;
        bloom.radius = 0.8;
        composer.addPass(bloom);

        const fxaa = new ShaderPass(FXAAShader);
        fxaa.material.uniforms['resolution'].value.set(1 / window.innerWidth, 1 / window.innerHeight);
        composer.addPass(fxaa);

        // ------------------- HDR Background (equirectangular) -------------------
        // sample equirectangular JPG (CORS-friendly sample from three.js examples)
        const HDR_URL = 'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg';
        let hdrTexture = null;
        new THREE.TextureLoader().load(HDR_URL, (tex) => {
            tex.mapping = THREE.EquirectangularReflectionMapping;
            tex.encoding = THREE.sRGBEncoding;
            hdrTexture = tex;
            // we won't set scene.background directly because shader uses the texture sampling
        });

        // ------------------- Fullscreen lensing shader quad -------------------
        const quadGeo = new THREE.PlaneGeometry(2, 2);

        // uniform structure
        const fsUniforms = {
            uTime: { value: 0.0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uCameraPitch: { value: 0.0 },
            uCameraYaw: { value: 0.0 },
            uUseHDR: { value: 1 },
            uHDR: { value: null },
            uDiskInner: { value: 0.8 },
            uDiskOuter: { value: 3.2 },
            uSpin: { value: 1.25 },
            uExposure: { value: 1.02 },
            uViewDistance: { value: 8.0 }
        };

        // shader that uses camera pitch/yaw to rotate view-space sampling so lensing responds to camera orientation
        const fsMat = new THREE.ShaderMaterial({
            uniforms: fsUniforms,
            vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position,1.0); }`,
            fragmentShader: `precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uResolution;
    uniform float uCameraPitch;
    uniform float uCameraYaw;
    uniform sampler2D uHDR;
    uniform int uUseHDR;
    uniform float uDiskInner;
    uniform float uDiskOuter;
    uniform float uSpin;
    uniform float uExposure;
    uniform float uViewDistance;

    // helpers
    float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f*f*(3.-2.*f);
      float a=hash(i), b=hash(i+vec2(1.,0.)), c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }

    // rotate a 2D vector by yaw/pitch approximations (we only need approximate transform)
    vec2 rotateByCamera(vec2 p, float pitch, float yaw){
      // rotate in 2D by yaw then skew by pitch for vertical tilt effect
      float c = cos(yaw), s = sin(yaw);
      vec2 r = vec2(p.x * c - p.y * s, p.x * s + p.y * c);
      // tilt: compress y by cos(pitch) and shift
      r.y = r.y * cos(pitch) + sin(pitch) * 0.25;
      return r;
    }

    // sample HDR equirectangular using a projected direction (approx)
    vec3 sampleEquirect(sampler2D env, vec2 dir){
      // dir in screen-centered coords; map to spherical uv
      float theta = atan(dir.y, dir.x); // -pi..pi
      float r = length(dir);
      // map radial distance to vertical (latitude) roughly
      float v = clamp(0.5 + r * 0.12, 0.0, 1.0);
      float u = fract(0.5 + theta / (2.0 * 3.14159265));
      return texture2D(env, vec2(u, v)).rgb;
    }

    vec3 blackbody(float t){
      vec3 c1 = vec3(1.0,0.72,0.35), c2 = vec3(1.0,1.0,0.95), c3 = vec3(0.6,0.8,1.0);
      if(t < 0.5) return mix(c1, c2, t*2.);
      return mix(c2, c3, (t-0.5)*2.);
    }

    float lensWarp(float r){
      float s = 1.5;
      return (1.0 / (1.0 + pow(r*1.3, 2.0) * s));
    }

    void main(){
      vec2 uv = vUv;
      // center coords with aspect correction
      vec2 p = (uv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);
      // rotate sampling by camera yaw/pitch (approx)
      vec2 rp = rotateByCamera(p, uCameraPitch, uCameraYaw);

      float r = length(rp);
      float angle = atan(rp.y, rp.x);

      float horizon = 0.28;
      float photonR = horizon * 1.45;

      // sample background (HDR or procedural)
      vec3 bg;
      if(uUseHDR == 1){
        // warp radius for lensing effect and sample HDR
        float w = lensWarp(r);
        vec2 sampleP = vec2(cos(angle), sin(angle)) * r * w * 1.2;
        bg = sampleEquirect(uHDR, sampleP);
      } else {
        // procedural starfield
        vec2 sp = rp * 0.5 + vec2(0.015*uTime, 0.007*uTime);
        float bright = 0.0;
        float accum = 0.0;
        for(int i=0;i<5;i++){
          float sc = mix(20.0, 220.0, float(i)/4.0);
          float n = noise(sp * sc);
          float st = step(0.996 - float(i)*0.01, n);
          float glow = pow(smoothstep(0.98 - float(i)*0.01, 1.0, n), 6.0) * (1.0/float(i+1));
          bright += st*1.0 + glow*3.0;
          accum += glow;
        }
        bg = vec3(0.02) + vec3(0.7,0.8,1.0) * (0.03*accum) + vec3(0.01)*bright;
      }

      // disk (thin projected band)
      float diskMask = smoothstep(uDiskInner, uDiskInner + 0.02, r) * (1.0 - smoothstep(uDiskOuter - 0.05, uDiskOuter, r));
      float radialPos = smoothstep(uDiskInner, uDiskOuter, r);
      float hot = 1.0 - pow(radialPos, 1.2);
      float turb = noise(vec2(angle*4.0, r*8.0 - uTime*0.9));
      float dop = sin(angle*1.0 + uTime*uSpin) * 0.5 + 0.5;
      float doppler = mix(0.8, 1.6, dop);
      vec3 diskBase = blackbody(clamp(hot + turb*0.4, 0.0, 1.0));
      diskBase.r *= mix(0.95, 0.7, dop); diskBase.b *= mix(0.7, 1.2, dop);
      vec3 diskColor = diskBase * doppler * diskMask;

      // photon ring highlight
      float ring = exp(-pow((r - photonR)/0.035, 2.0)*12.0);
      vec3 ringCol = vec3(1.0,0.92,0.8) * ring * 1.5;

      // black core
      if(r < horizon){
        gl_FragColor = vec4(vec3(0.0), 1.0);
        return;
      }

      // combine
      vec3 color = bg * 0.35 + diskColor + ringCol * 1.0;
      color *= 1.0 - smoothstep(0.0, uDiskOuter*1.15, r) * 0.75;
      color = 1.0 - exp(-color * uExposure);
      color = pow(color, vec3(1.0/1.05));
      gl_FragColor = vec4(color, 1.0);
    }`
        });
        fsMat.frustumCulled = false;
        const quad = new THREE.Mesh(quadGeo, fsMat);
        quad.frustumCulled = false;
        scene.add(quad);

        // give shader HDR texture uniform when loaded
        if (hdrTexture) fsUniforms.uHDR.value = hdrTexture;

        // ------------------- 3D Accretion Disk (mesh) -------------------
        // create a torus-like disk but flattened and large radius; use custom shader for disk material to get detail
        const diskGeo = new THREE.RingGeometry(0.9, 3.8, 512, 1, 0, Math.PI * 2);
        const diskMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0.0 },
                uCenter: { value: new THREE.Vector3(0, 0, 0) },
                uSpin: { value: 1.25 },
                uInner: { value: 0.9 },
                uOuter: { value: 3.8 }
            },
            vertexShader: `
    varying vec2 vUv;
    varying vec3 vPos;
    void main(){
      vUv = uv;
      vPos = position;
      // slightly tilt disk for cinematic look
      vec3 pos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }`,
            fragmentShader: `
    varying vec2 vUv;
    varying vec3 vPos;
    uniform float uTime;
    uniform float uSpin;
    uniform float uInner;
    uniform float uOuter;

    // simple noise
    float hash(vec2 p){ p = fract(p*vec2(12.9898,78.233)); p = p*(p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){
      vec2 i = floor(p); vec2 f = fract(p);
      f = f*f*(3.0 - 2.0*f);
      float a = hash(i), b = hash(i + vec2(1.0,0.0)), c = hash(i + vec2(0.0,1.0)), d = hash(i + vec2(1.0,1.0));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }

    vec3 blackbody(float t){
      vec3 c1 = vec3(1.0,0.72,0.35), c2 = vec3(1.0,1.0,0.95), c3 = vec3(0.6,0.8,1.0);
      if(t < 0.5) return mix(c1,c2,t*2.0);
      return mix(c2,c3,(t-0.5)*2.0);
    }

    void main(){
      float r = length(vPos.xy);
      if(r < uInner || r > uOuter) discard;

      // radial normalized
      float t = (r - uInner) / (uOuter - uInner);
      float hot = 1.0 - pow(t, 1.2);
      float n = noise(vec2(vPos.x*2.0, vPos.y*2.0 - uTime*0.8));
      vec3 col = blackbody(clamp(hot + n*0.4, 0.0, 1.0));
      float angle = atan(vPos.y, vPos.x);
      float dop = sin(angle + uTime*uSpin)*0.5 + 0.5;
      col.r *= mix(0.9, 0.7, dop); col.b *= mix(0.7,1.2,dop);
      // subtle fade near edges
      float edge = smoothstep(uInner, uInner + 0.06, r) * (1.0 - smoothstep(uOuter - 0.06, uOuter, r));
      col *= edge;
      gl_FragColor = vec4(col, edge);
    }`,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const diskMesh = new THREE.Mesh(diskGeo, diskMat);
        diskMesh.rotation.x = Math.PI * 0.5 - 0.15; // tilt it slightly like movie
        diskMesh.position.y = -0.02; // slight offset
        scene.add(diskMesh);

        // ------------------- Black hole core mesh (dark sphere) -------------------
        const coreGeo = new THREE.SphereGeometry(0.28, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        // ------------------- Particle system (instanced) -------------------
        let particleMesh = null;
        const PARTICLE_COUNT = 6000;

        function buildParticles(count) {
            if (particleMesh) {
                scene.remove(particleMesh);
                particleMesh.geometry.dispose();
                particleMesh.material.dispose();
                particleMesh = null;
            }
            // use instanced attributes with a small quad geometry
            const quad = new THREE.PlaneGeometry(0.06, 0.06);
            const inst = new THREE.InstancedBufferGeometry();
            inst.index = quad.index;
            inst.attributes.position = quad.attributes.position;
            inst.attributes.uv = quad.attributes.uv;

            const offsets = new Float32Array(count * 3);
            const speeds = new Float32Array(count);
            const angles = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const radius = 1.4 + Math.random() * 6.0;
                const a = Math.random() * Math.PI * 2;
                offsets[i * 3 + 0] = Math.cos(a) * radius;
                offsets[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
                offsets[i * 3 + 2] = Math.sin(a) * radius;
                speeds[i] = 0.1 + Math.random() * 0.8;
                angles[i] = a;
            }
            inst.setAttribute('offset', new THREE.InstancedBufferAttribute(offsets, 3));
            inst.setAttribute('speed', new THREE.InstancedBufferAttribute(speeds, 1));
            inst.setAttribute('ang', new THREE.InstancedBufferAttribute(angles, 1));

            const pMat = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0.0 } },
                vertexShader: `
      attribute vec3 offset;
      attribute float speed;
      attribute float ang;
      uniform float uTime;
      varying float vAlpha;
      varying vec2 vUv;
      void main(){
        vUv = uv;
        float angNow = ang + uTime * speed * 1.4;
        float r0 = length(offset.xz);
        float shrink = max(0.0, r0 - (uTime * speed * 0.12));
        float x = cos(angNow) * shrink;
        float z = sin(angNow) * shrink;
        float y = offset.y * (1.0 - uTime*0.02*speed);
        float alph = smoothstep(0.45, 0.08, shrink);
        vAlpha = alph;
        vec3 pos = vec3(x, y, z);
        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        float scale = 0.03 + (1.0 / (1.0 + length(mvPos.xyz))) * 0.06;
        mvPos.xy += position.xy * scale;
        gl_Position = projectionMatrix * mvPos;
      }`,
                fragmentShader: `
      varying float vAlpha;
      varying vec2 vUv;
      void main(){
        float d = length(vUv - 0.5);
        float a = smoothstep(0.5, 0.0, d);
        vec3 col = mix(vec3(1.0,0.9,0.6), vec3(0.8,0.9,1.0), vUv.x);
        gl_FragColor = vec4(col, a * vAlpha);
      }`,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleMesh = new THREE.Mesh(inst, pMat);
            particleMesh.frustumCulled = false;
            scene.add(particleMesh);
        }
        buildParticles(PARTICLE_COUNT);

        // ------------------- UI bindings -------------------
        const controlMode = document.getElementById('controlMode');
        const hdrToggle = document.getElementById('hdrToggle');
        const particlesToggle = document.getElementById('particlesToggle');
        const resetCamBtn = document.getElementById('resetCamBtn');

        controlMode.addEventListener('change', () => {
            const mode = controlMode.value;
            if (mode === 'orbit') {
                flightMode.enabled = false;
                orbitControls.enabled = true;
                // unlock pointer if locked
                if (document.exitPointerLock) document.exitPointerLock();
            } else {
                flightMode.enabled = true;
                orbitControls.enabled = false;
                // allow pointer lock button to engage
            }
        });

        hdrToggle.addEventListener('change', () => {
            fsUniforms.uUseHDR.value = hdrToggle.checked ? 1 : 0;
            if (hdrTexture) fsUniforms.uHDR.value = hdrTexture;
        });

        particlesToggle.addEventListener('change', () => {
            if (particleMesh) particleMesh.visible = particlesToggle.checked;
        });

        resetCamBtn.addEventListener('click', () => {
            // smooth reset
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(0, 1.2, 8);
            const startTarget = orbitControls.target.clone();
            const endTarget = new THREE.Vector3(0, 0, 0);
            const dur = 0.9;
            const t0 = performance.now();
            (function tick(now) {
                const tt = Math.min(1, (now - t0) / (dur * 1000));
                const s = tt * tt * (3 - 2 * tt);
                camera.position.lerpVectors(startPos, endPos, s);
                orbitControls.target.lerpVectors(startTarget, endTarget, s);
                if (tt < 1) requestAnimationFrame(tick);
            })();
        });

        // pointer lock toggle for flight
        pointerLockBtn.addEventListener('click', () => {
            if (document.body.requestPointerLock) document.body.requestPointerLock();
        });

        // ------------------- resize -------------------
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            fsUniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            fxaa.material.uniforms['resolution'].value.set(1 / window.innerWidth, 1 / window.innerHeight);
        });

        // ------------------- Animation loop -------------------
        const clock = new THREE.Clock();
        let lastMove = performance.now();

        function updateFlight(dt) {
            // orientation from yaw/pitch
            const cosPitch = Math.cos(flightMode.pitch), sinPitch = Math.sin(flightMode.pitch);
            const cosYaw = Math.cos(flightMode.yaw), sinYaw = Math.sin(flightMode.yaw);
            // forward vector
            const forward = new THREE.Vector3(cosPitch * sinYaw, sinPitch, cosPitch * cosYaw);
            const right = new THREE.Vector3(Math.cos(flightMode.yaw), 0, -Math.sin(flightMode.yaw));
            const up = new THREE.Vector3(0, 1, 0);
            // movement
            let move = new THREE.Vector3();
            if (keys['KeyW']) move.add(forward);
            if (keys['KeyS']) move.sub(forward);
            if (keys['KeyA']) move.sub(right);
            if (keys['KeyD']) move.add(right);
            if (keys['KeyQ']) move.add(up);
            if (keys['KeyE']) move.sub(up);
            if (move.lengthSq() > 0) {
                move.normalize();
                camera.position.addScaledVector(move, flightMode.speed * (1 + (keys['ShiftLeft'] ? 2.0 : 0.0)));
                lastMove = performance.now();
            }
            // apply orientation to camera
            const euler = new THREE.Euler(flightMode.pitch, flightMode.yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
            orbitControls.update();
        }

        (function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            fsUniforms.uTime.value = t;
            diskMat.uniforms.uTime.value = t;
            if (particleMesh) particleMesh.material.uniforms.uTime.value = t;

            // update camera-based uniforms: derive yaw/pitch from camera quaternion for shader
            // easier: extract Euler from camera.quaternion
            const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
            fsUniforms.uCameraYaw.value = e.y;
            fsUniforms.uCameraPitch.value = e.x;
            fsUniforms.uViewDistance.value = camera.position.length();

            // HUD / controls
            if (flightMode.enabled) {
                updateFlight(clock.getDelta());
            } else {
                orbitControls.update();
            }

            // particles visibility
            if (particleMesh) particleMesh.visible = particlesToggle.checked;

            // update HDR uniform if loaded
            if (hdrTexture && fsUniforms.uHDR.value === null) fsUniforms.uHDR.value = hdrTexture;

            composer.render();
        })();
