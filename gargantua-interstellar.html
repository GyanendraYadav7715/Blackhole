<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Gargantua-style Black Hole — Interstellar Look</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 12;
            color: #ddd;
            background: rgba(0, 0, 0, 0.45);
            padding: 10px 12px;
            border-radius: 8px;
            min-width: 200px;
        }

        #ui label {
            display: block;
            margin: 6px 0;
            font-size: 13px;
        }

        button {
            margin-top: 6px;
            padding: 6px 8px;
        }

        .small {
            font-size: 12px;
            color: #bbb;
            margin-top: 4px;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.169.0/examples/jsm/controls/OrbitControls.js",
    "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/EffectComposer.js",
    "three/examples/jsm/postprocessing/RenderPass.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/RenderPass.js",
    "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/UnrealBloomPass.js",
    "three/examples/jsm/postprocessing/ShaderPass.js": "https://unpkg.com/three@0.169.0/examples/jsm/postprocessing/ShaderPass.js",
    "three/examples/jsm/shaders/FXAAShader.js": "https://unpkg.com/three@0.169.0/examples/jsm/shaders/FXAAShader.js"
  }
}
</script>
</head>

<body>
    <div id="ui">
        <strong>Gargantua — Interstellar Look</strong>
        <label><input id="orbitOnly" type="checkbox" checked> Orbit camera only (recommended)</label>
        <button id="resetBtn">Reset Camera</button>
        <div class="small">Tip: Orbit to frame, zoom to change distance. Desktop recommended.</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/examples/jsm/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/examples/jsm/shaders/FXAAShader.js';

        // ---------------- renderer/scene/camera ----------------
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 2000);
        // Position camera to match the "slightly above" cinematic view
        camera.position.set(0, 0.65, 6.2);

        // Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.12;
        controls.minDistance = 1.2;
        controls.maxDistance = 40;
        controls.maxPolarAngle = Math.PI * 0.9;

        // ---------------- post-processing ----------------
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.8, 0.8, 0.25);
        bloom.threshold = 0.18;
        bloom.strength = 1.6;
        bloom.radius = 0.9;
        composer.addPass(bloom);

        // FXAA
        const fxaa = new ShaderPass(FXAAShader);
        fxaa.material.uniforms['resolution'].value.set(1 / innerWidth, 1 / innerHeight);
        composer.addPass(fxaa);

        // chromatic aberration / subtle vignette pass (simple shader)
        const chromaShader = {
            uniforms: {
                tDiffuse: { value: null },
                resolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
                amount: { value: 0.002 } // tweak for strength
            },
            vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position,1.0); }`,
            fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D tDiffuse;
    uniform vec2 resolution;
    uniform float amount;
    vec3 sampleRGB(vec2 uv, float off){
      vec2 o = vec2(off / resolution.x, 0.0);
      float r = texture2D(tDiffuse, uv + o).r;
      float g = texture2D(tDiffuse, uv).g;
      float b = texture2D(tDiffuse, uv - o).b;
      return vec3(r,g,b);
    }
    void main(){
      float side = smoothstep(0.0,1.0,length(vUv - 0.5));
      vec3 c = sampleRGB(vUv, amount * 800.0);
      // slight vignette
      float v = 1.0 - smoothstep(0.2, 0.95, length(vUv - 0.5));
      c *= mix(1.0, 0.85, 1.0 - v);
      gl_FragColor = vec4(c,1.0);
    }`
        };
        const chromaPass = new ShaderPass(new THREE.ShaderMaterial({
            uniforms: THREE.UniformsUtils.clone(chromaShader.uniforms),
            vertexShader: chromaShader.vertexShader,
            fragmentShader: chromaShader.fragmentShader
        }), 'tDiffuse');
        composer.addPass(chromaPass);

        // ---------------- starfield (equirectangular-like) ----------------
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 18000;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const r = 40 + Math.random() * 160;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, sizeAttenuation: true, transparent: true, opacity: 0.9 });
        const starField = new THREE.Points(starsGeometry, starsMat);
        scene.add(starField);

        // ---------------- full-screen lensing shader (warp + photon ring) ----------------
        const fsUniforms = {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
            uCameraYaw: { value: 0 },
            uCameraPitch: { value: 0 },
            uHorizonRadius: { value: 0.28 }, // core radius
            uPhotonScale: { value: 1.45 },
            uDiskInner: { value: 0.85 },
            uDiskOuter: { value: 3.05 },
            uExposure: { value: 1.05 },
            uTiltAmount: { value: 0.15 } // influences top arc prominence
        };

        const fsMaterial = new THREE.ShaderMaterial({
            uniforms: fsUniforms,
            vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position,1.0); }`,
            fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uResolution;
    uniform float uHorizonRadius;
    uniform float uPhotonScale;
    uniform float uDiskInner, uDiskOuter;
    uniform float uExposure;
    uniform float uTiltAmount;

    // small noise
    float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); f=f*f*(3.0-2.0*f);
      float a = hash(i), b = hash(i+vec2(1.0,0.0)), c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }

    // center and aspect correction
    vec2 centerUV(vec2 uv){
      return (uv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);
    }

    // lensing approximate warp (stronger near center)
    float warp(float r){
      float s = 1.6;
      return (1.0 / (1.0 + pow(r*1.2, 2.0) * s));
    }

    void main(){
      vec2 p = centerUV(vUv);
      float r = length(p);
      float angle = atan(p.y, p.x);

      // apply tilt to make top arc brighter (simulate perspective tilt)
      float tilt = sin(angle) * uTiltAmount;
      float rTilt = r * (1.0 - tilt*0.25);

      // horizon & photon ring
      float horizon = uHorizonRadius;
      float photonR = horizon * uPhotonScale;

      // procedural background star sampling: sample with warp for lensing effect
      float w = warp(rTilt);
      vec2 sample = vec2(cos(angle), sin(angle)) * rTilt * w * 1.2;
      // create simple star color based on sample coords and a bit of noise
      float stars = smoothstep(0.995, 0.9995, hash(sample * 103.0 + vec2(uTime*0.01)));
      float glowStars = pow(max(0.0, 1.0 - length(fract(sample*10.0)-0.5)), 12.0) * 0.6;
      vec3 bg = vec3(0.02) + vec3(0.85,0.9,1.0) * (stars*0.9 + glowStars*0.6);

      // accretion disk mask and color
      float diskMask = smoothstep(uDiskInner, uDiskInner + 0.02, r) * (1.0 - smoothstep(uDiskOuter - 0.05, uDiskOuter, r));
      float radial = smoothstep(uDiskInner, uDiskOuter, r);
      float hot = 1.0 - pow(radial, 1.12);
      float tnoise = noise(vec2(angle * 6.0, r * 12.0 - uTime * 0.9));
      float dop = sin(angle * 1.0 + uTime * 1.0) * 0.5 + 0.5;
      vec3 diskCol = mix(vec3(1.0,0.8,0.55), vec3(1.0,1.0,0.95), hot);
      diskCol = mix(diskCol, vec3(0.6,0.85,1.0), dop * 0.4);
      diskCol *= 1.0 + tnoise * 0.35;
      vec3 disk = diskCol * diskMask;

      // photon ring brightening (thick)
      float ring = exp(-pow((r - photonR) / 0.03, 2.0) * 10.0) * 1.6;
      // inner white rim
      float innerRim = exp(-pow((r - (horizon * 1.05)) / 0.015, 2.0) * 40.0) * 1.2;

      // inside horizon => black core
      if(r < horizon){
        gl_FragColor = vec4(vec3(0.0), 1.0);
        return;
      }

      vec3 color = bg * 0.28 + disk + vec3(1.0, 0.92, 0.78) * (ring + innerRim);

      // emulate the strong top arc and faint mirrored lower arc:
      // make top side brighter by weighting by sign of p.y (top positive)
      float sideBias = smoothstep(0.0, 0.8, p.y * 0.9 + 0.1);
      color *= mix(0.8, 1.2, sideBias); // top arc brighter

      // darken far outer region for vignette / depth
      color *= 1.0 - smoothstep(0.0, uDiskOuter * 1.18, r) * 0.88;

      // simple tone map + exposure
      color = 1.0 - exp(-color * uExposure);
      color = pow(color, vec3(1.0/1.05));
      gl_FragColor = vec4(color, 1.0);
    }
  `,
            transparent: true,
            depthWrite: false
        });
        fsMaterial.frustumCulled = false;
        const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fsMaterial);
        fsQuad.frustumCulled = false;
        scene.add(fsQuad);

        // ---------------- 3D Accretion disk mesh (tilted, emissive streaks) ----------------
        const diskInner = 0.85, diskOuter = 3.05;
        const diskGeo = new THREE.RingGeometry(diskInner, diskOuter, 1024, 1);
        const diskMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uInner: { value: diskInner }, uOuter: { value: diskOuter }, uSpin: { value: 1.05 } },
            vertexShader: `
    varying vec2 vUv;
    varying vec3 vPos;
    void main(){
      vUv = uv;
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
            fragmentShader: `
    varying vec2 vUv;
    varying vec3 vPos;
    uniform float uTime, uInner, uOuter, uSpin;
    float hash(vec2 p){ p = fract(p*vec2(12.9898,78.233)); p = p*(p+45.32); return fract(p.x*p.y); }
    float noise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); f=f*f*(3.0-2.0*f); float a=hash(i), b=hash(i+vec2(1.,0.)), c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.)); return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
    vec3 blackbody(float t){ vec3 c1=vec3(1.0,0.8,0.45), c2=vec3(1.0,1.0,0.95), c3=vec3(0.6,0.85,1.0); if(t<0.5) return mix(c1,c2,t*2.0); return mix(c2,c3,(t-0.5)*2.0); }
    void main(){
      float r = length(vPos.xy);
      if(r < uInner || r > uOuter) discard;
      float t = (r - uInner) / (uOuter - uInner);
      float hot = 1.0 - pow(t,1.12);
      float n = noise(vec2(vPos.x*3.0, vPos.y*3.0 - uTime*0.9));
      float angle = atan(vPos.y, vPos.x);
      float dop = sin(angle + uTime*uSpin) * 0.5 + 0.5;
      vec3 col = blackbody(clamp(hot + n*0.45,0.0,1.0));
      col.r *= mix(0.95,0.72,dop); col.b *= mix(0.7,1.15,dop);
      float edge = smoothstep(uInner, uInner + 0.06, r) * (1.0 - smoothstep(uOuter - 0.06, uOuter, r));
      gl_FragColor = vec4(col * edge, edge * 0.98);
    }`,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const diskMesh = new THREE.Mesh(diskGeo, diskMat);
        diskMesh.rotation.x = Math.PI * 0.5 - 0.12;
        diskMesh.position.y = -0.02;
        scene.add(diskMesh);

        // ---------------- mirrored faint reflection below the disk ----------------
        // we fake the reflection by rendering a second disk with darker, blurred appearance
        const mirrorDiskMat = diskMat.clone();
        mirrorDiskMat.uniforms = THREE.UniformsUtils.clone(diskMat.uniforms);
        mirrorDiskMat.transparent = true;
        mirrorDiskMat.blending = THREE.AdditiveBlending;
        mirrorDiskMat.opacity = 0.35; // fainter
        const mirrorMesh = diskMesh.clone();
        mirrorMesh.material = mirrorDiskMat;
        mirrorMesh.scale.set(1.0, -1.0, 1.0); // flip vertically
        mirrorMesh.position.y = -0.14; // lower so it looks like reflection
        mirrorMesh.rotation.x = Math.PI * 0.5 + 0.22; // slightly different tilt for realism
        mirrorMesh.material.depthWrite = false;
        scene.add(mirrorMesh);

        // ---------------- central dark sphere ----------------
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.28, 48, 48), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        scene.add(core);

        // ---------------- small subtle corona glow (fuzzy sphere) ----------------
        const glowGeo = new THREE.SphereGeometry(0.95, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xffb770, transparent: true, opacity: 0.065, blending: THREE.AdditiveBlending });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        scene.add(glow);

        // ---------------- particles (spiraling streaks) ----------------
        function makeParticles(count = 4500) {
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                const r = 1.2 + Math.random() * 6.0;
                const a = Math.random() * Math.PI * 2;
                pos[i * 3] = Math.cos(a) * r;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 0.55;
                pos[i * 3 + 2] = Math.sin(a) * r;
                const t = Math.random();
                col[i * 3] = 1.0; col[i * 3 + 1] = 0.85 + Math.random() * 0.15; col[i * 3 + 2] = 0.6 + Math.random() * 0.3;
                sizes[i] = 0.6 + Math.random() * 1.2;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
            geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const mat = new THREE.PointsMaterial({ vertexColors: true, size: 0.06, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
            const pts = new THREE.Points(geom, mat);
            scene.add(pts);
            return pts;
        }
        const particles = makeParticles(4800);

        // ---------------- UI / interactions ----------------
        const orbitOnly = document.getElementById('orbitOnly');
        const resetBtn = document.getElementById('resetBtn');
        orbitOnly.addEventListener('change', () => {
            if (orbitOnly.checked) {
                controls.enabled = true;
                controls.minDistance = 1.2;
            } else {
                controls.enabled = true;
            }
        });
        resetBtn.addEventListener('click', () => {
            // smooth reset camera to cinematic viewpoint
            const s = camera.position.clone();
            const t = new THREE.Vector3(0, 0.65, 6.2);
            const dur = 0.9;
            const t0 = performance.now();
            (function tick(now) {
                const tt = Math.min(1, (now - t0) / (dur * 1000));
                const k = tt * tt * (3 - 2 * tt);
                camera.position.lerpVectors(s, t, k);
                controls.target.lerpVectors(controls.target, new THREE.Vector3(0, 0, 0), k);
                if (tt < 1) requestAnimationFrame(tick);
            })();
        });

        // resize handling
        window.addEventListener('resize', () => {
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            fsUniforms.uResolution.value.set(innerWidth, innerHeight);
            fxaa.material.uniforms['resolution'].value.set(1 / innerWidth, 1 / innerHeight);
            chromaPass.material.uniforms.resolution.value.set(innerWidth, innerHeight);
        });

        // ---------------- animate loop ----------------
        const clock = new THREE.Clock();
        (function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            fsMaterial.uniforms.uTime.value = t;
            diskMat.uniforms.uTime.value = t;
            mirrorDiskMat.uniforms.uTime.value = t;

            // subtle slow spin of stars for parallax
            starField.rotation.y = t * 0.002;

            // camera orientation used for shader tilt bias
            const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
            fsUniforms.uCameraYaw.value = e.y;
            fsUniforms.uCameraPitch.value = e.x;

            // update shader uniforms for resolution/time
            fsMaterial.uniforms.uTime.value = t;
            fsMaterial.uniforms.uTiltAmount.value = 0.18; // increase tilt for more top arc contrast

            // animate particles (just a subtle rotation for impression of inward motion)
            particles.rotation.y = t * 0.18;

            controls.update();
            composer.render();
        })();
    </script>
</body>

</html>
